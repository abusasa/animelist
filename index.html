<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Список Абусамата</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>@font-face{font-family:Minecraft;src:url(minecraft.ttf)format('truetype');font-display:swap}body{font-family:Minecraft,sans-serif;background:#000;color:#0f0;padding:18px;margin:0;cursor:none}.cursor{position:fixed;top:0;left:0;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none;mix-blend-mode:screen;box-shadow:0 0 12px rgba(255,255,255,.5)}.typing-demo{font-size:2.2rem;margin-bottom:16px}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}input{padding:8px 10px;background:#111;color:#0f0;border:1px solid #0f0}button{padding:8px 10px;background:#111;color:#0f0;border:1px solid #0f0;cursor:pointer}#anime-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.anime-card{padding:12px;border:1px solid rgba(0,255,0,.5);background:rgba(0,255,0,.03);border-radius:6px}.anime-card:hover{background:rgba(0,255,0,.08)}.anime-name{font-size:1rem;line-height:1.5}.hidden{display:none}.search-info{color:#0f0}</style>
</head>
<body>
<div class="cursor"></div>
<div class="typing-demo">Список посмотренных аниме Абусамата ;)</div>
<div class="controls"><input type="text" id="search" placeholder="Поиск аниме..."><button id="reset-search">Сброс</button><div id="search-info">Показано: 0</div></div>
<div id="anime-list">Загрузка...</div>
<script>const q=e=>document.getElementById(e),s=e=>q("search-info").innerText=`Показано: ${e.length} из ${window.animeArray.length}`,d=e=>q("anime-list").innerHTML=e.length?e.map(a=>`<div class="anime-card"><div class="anime-name">${a}</div></div>`).join(""):`<div class="anime-card"><div class="anime-name">Ничего не найдено</div></div>`,l=()=>{const e=q("search").value.trim().toLowerCase(),a=window.animeArray.filter(t=>t.toLowerCase().includes(e));s(a),d(a)};q("search").addEventListener("input",l);q("reset-search").addEventListener("click",()=>{q("search").value="",l()});fetch("https://raw.githubusercontent.com/abusasa/animelist/main/myanimelist.txt").then(r=>r.text()).then(t=>{window.animeArray=t.split(/\r?\n/).filter(Boolean);d(window.animeArray.slice(0,10));s(window.animeArray)}).catch(()=>q("anime-list").innerHTML="Не удалось загрузить список.");document.addEventListener("mousemove",e=>{const t=document.querySelector(".cursor");t.style.left=`${e.clientX}px`;t.style.top=`${e.clientY}px`});</script>
</body>
</html>
